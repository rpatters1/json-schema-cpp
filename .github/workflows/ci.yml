name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # lets a failing job cancel the rest of the run

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            config: Release
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            config: Release
          - name: Linux GCC shared
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            config: Release
            extra: -DBUILD_SHARED_LIBS=ON
          - name: Linux Clang ASan+UBSan
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            config: Debug
            extra: -DJSONSCHEMA_SANITIZE=address,undefined
          - name: macOS AppleClang (10.15 target)
            os: macos-latest
            config: Release
            extra: -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          - name: Windows MSVC
            os: windows-latest
            config: Release
          - name: Windows MSVC shared
            os: windows-latest
            config: Release
            extra: -DBUILD_SHARED_LIBS=ON

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select compiler
        if: matrix.cc
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DJSONSCHEMA_WARNINGS_AS_ERRORS=ON
          ${{ matrix.extra }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      # Unit tests plus one test per JSON-Schema-Test-Suite file. Suite tests fail on any
      # result not recorded in tests/suite/expected-failures.json, so they gate regressions.
      - name: Tests
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --timeout 300

      # fail-fast stops only this matrix; this also stops the suite report job.
      - name: Cancel the run on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  test-suite:
    name: JSON-Schema-Test-Suite report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel --target jsonschema_suite_runner

      # A summary table for the run page. The build-and-test jobs are the gate; this step
      # fails only if an outcome differs from tests/suite/expected-failures.json, which
      # includes a stale-entry check that per-file runs cannot do.
      - name: Run suite
        shell: bash
        run: |
          runner=./build/bin/jsonschema_suite_runner
          args="--tests-dir third_party/JSON-Schema-Test-Suite/validation/tests --expected-failures tests/suite/expected-failures.json"
          "$runner" $args --markdown >> "$GITHUB_STEP_SUMMARY" || {
            # Show which outcomes differ from expected-failures.json.
            "$runner" $args | grep -v ' 0 failed, 0 errored (.* 0 unexpected passes)' || true
            exit 1
          }

      - name: Cancel the run on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
